# Tethys cppcheck project-wide configuration.
# Cite: cppcheck manual - https://cppcheck.sourceforge.io/manual.html
# Cite: ADR-0003 (MISRA C:2023 as the coding gate) - cppcheck-misra is the
#       primary MISRA gate, the rule-text index lives in
#       docs/misra-c-2023-rules.txt.
# Trace: docs/coding-standard.md - banned constructs; docs/misra-deviations.md
#        - deviation register.
#
# This file is **not** a standard cppcheck format; it is a documented invocation
# wrapper consumed by .github/workflows/misra-gate.yml. Real cppcheck options
# below are passed via the workflow command line.

[paths]
# Sources cppcheck scans.
include = slave/include slave/src master/src/tethys_master simulator/src/tethys_sim

# Files / paths cppcheck must skip.
exclude = slave/build slave/cmake-build-* slave/.tmp build cmake-build-* .venv .git

[invocation]
# Canonical invocation used by misra-gate.yml. Reproduced here for local runs.
#
#   cppcheck \
#     --addon=misra.json \
#     --enable=warning,style,performance,portability,information,missingInclude \
#     --error-exitcode=2 \
#     --inline-suppr \
#     --suppressions-list=cppcheck-suppressions.txt \
#     --rule-texts=docs/misra-c-2023-rules.txt \
#     --std=c11 \
#     --language=c \
#     --quiet \
#     --xml --xml-version=2 \
#     -I slave/include \
#     slave/src
#
# misra.json is the cppcheck-misra addon JSON file shipped with the cppcheck
# package (Ubuntu apt: `cppcheck` -> /usr/share/cppcheck/addons/misra.json).

[severity]
# Mandatory + required MISRA C:2023 rules => error (gate-blocking).
# Advisory MISRA C:2023 rules            => style  (logged, not blocking).
# Both buckets surface in the workflow artefact; the misra-gate job exits 2 on
# the first error.

[deviation-register]
# Path to the deviation log consulted before merge.
file = docs/misra-deviations.md

[notes]
# 1. The cppcheck-misra addon ships with cppcheck itself (free, open source);
#    no Tethys-side install of MISRA rule texts is required. Per copyright we
#    keep only a one-line-per-rule index in docs/misra-c-2023-rules.txt for
#    cross-reference - the canonical authority is the official MISRA C:2023
#    document available from the MISRA consortium.
# 2. clang-tidy + gcc -fanalyzer + scan-build are run by
#    static-analysis.yml as a complementary tier; their config lives in
#    root .clang-tidy (this PR) and the workflow file (PR-4).
# 3. Future maintenance: pin cppcheck via Renovate (managed by
#    .github/renovate.json from PR-4).
