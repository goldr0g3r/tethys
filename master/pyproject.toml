[project]
name = "tethys-master"
version = "0.1.0"
description = "Tethys XCP master tool - license-free PC-side XCP 1.4 calibration + measurement (marine + space profiles)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tethys contributors", email = "tethys-master@example.com" },
]
requires-python = ">=3.11"
keywords = ["xcp", "asam", "calibration", "measurement", "marine", "space", "ecss", "iacs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]

# Pinned per .cursor/rules/version-pinning.mdc - every dep exact version.
# Renovate / Dependabot manage upgrades via PR.
dependencies = [
    "click==8.1.7",
    "jinja2==3.1.4",  # BSD-3 - HIL demo HTML report template (Phase 9 F2)
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "pyserial==3.5",  # BSD-3 - UART/SxI transport backend (Phase 5 PR-B)
    "structlog==24.4.0",
]

[project.optional-dependencies]
# GUI extras — pulled in only by `pip install tethys-master[gui]` so the
# headless CLI / Python API users do not pay the ~150 MB PySide6 install.
# Pinned per .cursor/rules/version-pinning.mdc; Renovate proposes bumps via PR.
gui = [
    "PySide6==6.8.0.2",  # LGPL — parent §5 + ADR-0007
    "pyqtgraph==0.13.7",  # MIT — real-time plots (parent §3.1)
    "asammdf==8.2.0",  # LGPL — MDF4 record/playback panel (Phase 6 PR-C)
]
dev = [
    "mypy==1.13.0",
    "pytest==9.0.3",  # CVE-2025-71176 fix (GHSA-6w46-j5rx-g56g)
    "pytest-asyncio==1.3.0",  # first release with pytest 9 support
    "pytest-cov==6.0.0",
    "pytest-qt==4.4.0",  # MIT — pytest-qt headless GUI smoke (Phase 6)
    "ruff==0.7.4",
]
# Differential-test against the pyxcp reference master (parent §8 Phase 2
# acceptance). pyxcp is LGPLv3 and runtime-imported only by the
# `master/tests/test_protocol_diff_pyxcp.py` test module - the Tethys
# master proper stays clean-room per ADR-0007 and PR-22's decision D1.
diff-test = [
    "pyxcp==0.29.8",
]

[project.scripts]
tethys-master = "tethys_master.cli:cli"
# Convenience direct-script entry-point that bypasses the click CLI for
# users who want a single binary in PATH. Identical to invoking
# `tethys-master gui`; pyproject [project.scripts] does not accept
# multi-word names so we expose both forms.
tethys-master-gui = "tethys_master.gui.app:main_cli"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv_build]
include = ["src/tethys_master/py.typed"]

# ---- Tool configuration ----

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I",  # pycodestyle, pyflakes, isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "S",            # flake8-bandit
    "PL",           # pylint
    "RUF",          # ruff-specific
]
ignore = [
    "PLR0913",      # too many arguments to function (XCP frames need them)
    "PLR2004",      # magic value comparison (protocol constants)
    "S101",         # assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration test requiring loopback transport",
    "gui: GUI test that needs PySide6 + pytest-qt; auto-skipped if Qt missing",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/tethys_master"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

