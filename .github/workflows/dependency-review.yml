name: dependency-review

# Dependency review per parent plan section 6.7.
# GitHub Dependency Review API flags new dependencies; allowed-licences list enforces
# the free-tool-only rule (ADR-0008 + .cursor/rules/free-tool-only.mdc).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency-review (licenses + CVEs)
    runs-on: ubuntu-latest
    # Only runs on PR events with both a base and head ref - the action exits with
    # an error if the repository hasn't been pushed to GitHub at least once or if
    # Dependency Graph isn't enabled. For public free-tier repos, Dependency Graph
    # is on by default.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # License gate uses deny-licenses (blocklist) rather than allow-licenses
          # (allowlist) because:
          #   1. Compound SPDX expressions like "BSD-2-Clause AND BSD-3-Clause"
          #      do not pattern-match against an individual allow-license list,
          #      causing legitimate dual-licensed packages (colorama, packaging)
          #      to fail.
          #   2. ADR-0008 (free-tool-only) is the rule; named proprietary
          #      licenses are the blocklist.
          # Human review of each Renovate / Dependabot PR is the final
          # licence gate per docs/runbooks/supply-chain-and-sbom.md §6.
          deny-licenses: >-
            AGPL-3.0,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            CC-BY-NC-1.0,
            CC-BY-NC-2.0,
            CC-BY-NC-2.5,
            CC-BY-NC-3.0,
            CC-BY-NC-4.0,
            CC-BY-NC-ND-1.0,
            CC-BY-NC-ND-2.0,
            CC-BY-NC-ND-2.5,
            CC-BY-NC-ND-3.0,
            CC-BY-NC-ND-4.0,
            CC-BY-NC-SA-1.0,
            CC-BY-NC-SA-2.0,
            CC-BY-NC-SA-2.5,
            CC-BY-NC-SA-3.0,
            CC-BY-NC-SA-4.0,
            CC-BY-ND-1.0,
            CC-BY-ND-2.0,
            CC-BY-ND-2.5,
            CC-BY-ND-3.0,
            CC-BY-ND-4.0,
            Parity-7.0.0,
            Parity-6.0.0,
            BUSL-1.1,
            SSPL-1.0
