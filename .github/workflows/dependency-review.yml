name: dependency-review

# Dependency review per parent plan section 6.7.
# GitHub Dependency Review API flags new dependencies; allowed-licences list enforces
# the free-tool-only rule (ADR-0008 + .cursor/rules/free-tool-only.mdc).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency-review (licenses + CVEs)
    runs-on: ubuntu-latest
    # Only runs on PR events with both a base and head ref - the action exits with
    # an error if the repository hasn't been pushed to GitHub at least once or if
    # Dependency Graph isn't enabled. For public free-tier repos, Dependency Graph
    # is on by default.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # On a fresh public repo without any pinned dependencies the action
          # reports "no manifest changes". That is fine - the job still succeeds.
          # GHAS premium features (paid) would add SCA / SCM analytics; not in
          # scope per ADR-0008 free-tool-only.
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            LGPL-2.1,
            LGPL-2.1-only,
            LGPL-2.1-or-later,
            LGPL-3.0,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            MPL-2.0,
            GPL-2.0,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0,
            GPL-3.0-only,
            GPL-3.0-or-later,
            Unlicense,
            CC0-1.0,
            Zlib,
            BlueOak-1.0.0,
            Python-2.0,
            PSF-2.0
