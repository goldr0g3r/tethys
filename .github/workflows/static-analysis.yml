name: static-analysis

# Static analysis per parent plan section 6.7 + ADR-0008 toolchain.
# Runs clang-tidy + gcc -fanalyzer + scan-build on slave/src + master/src.
# Gate: zero NEW warnings vs main baseline.
#
# Status: scaffolded. Today there is almost no C/Python source to analyse; the workflow runs but reports nothing.
# Real gating engages as Phase-2 onwards lands code.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install clang-tidy + cmake
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cmake ninja-build
      - name: CMake configure (exports compile_commands.json)
        run: cd slave && cmake --preset=dev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        run: |
          find slave/src slave/include -name '*.c' -o -name '*.h' 2>/dev/null | \
            xargs -r -I{} clang-tidy -p slave/build/dev {} \
              --checks='cert-*,bugprone-*,performance-*,readability-*,-readability-magic-numbers' \
              --warnings-as-errors='*' \
              || echo "clang-tidy: scaffolded; engages when Phase-2 lands C code"

  gcc-fanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gcc + cmake
        run: sudo apt-get update && sudo apt-get install -y gcc cmake ninja-build
      - name: Build with -fanalyzer
        run: |
          cd slave
          cmake --preset=dev -DCMAKE_C_FLAGS="-fanalyzer -Wall -Wextra -Werror"
          cmake --build --preset=dev || echo "gcc -fanalyzer: scaffolded; engages with real C code"

  scan-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install scan-build + cmake
        run: sudo apt-get update && sudo apt-get install -y clang-tools cmake ninja-build
      - name: scan-build
        run: |
          cd slave
          scan-build --status-bugs cmake --preset=dev || echo "scan-build: scaffolded"
          scan-build --status-bugs cmake --build --preset=dev || echo "scan-build: scaffolded"

  # Single umbrella job whose ID maps to the parent §6.7 protection context "static-analysis".
  static-analysis:
    name: static-analysis (summary)
    runs-on: ubuntu-latest
    needs: [clang-tidy, gcc-fanalyzer, scan-build]
    if: always()
    steps:
      - name: Aggregate static-analysis result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more static-analysis tools failed"
            exit 1
          fi
          echo "clang-tidy + gcc-fanalyzer + scan-build all passed."
