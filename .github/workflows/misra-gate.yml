name: misra-gate

# MISRA C:2023 gate per ADR-0003 + .cursor/rules/misra-c-2023-gate.mdc.
# Mandatory + required rules: zero deviations.
# Advisory rules: tracked in docs/misra-deviations.md (lands in PR-5); no PR-blocking gate.
#
# Tool: cppcheck --addon=misra (free; covers the MISRA C:2023 rule set per ADR-0008).
#
# Status: scaffolded. Today slave/src/ + slave/include/ are nearly empty (cmake-init stubs only).
# Real gating engages as Phase-2 (XCP protocol core) lands C code.

on:
  pull_request:
  push:
    branches: [main]

# Note: runs on EVERY PR (not just slave/** touches) so the misra-gate context
# is always reported and branch protection's required-status-check contract is
# satisfied. When slave/src/ + slave/include/ are empty, cppcheck reports
# "nothing to check" and the job exits 0.

permissions:
  contents: read

jobs:
  misra-gate:
    name: misra-gate (cppcheck-misra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Generate export header (cppcheck needs it for MISRA 8.4)
        run: |
          # tethys_<symbol> functions are declared in slave/include/tethys/*.h
          # which depends on slave/build/export/tethys/tethys_export.h
          # generated by CMake's GenerateExportHeader. cppcheck needs both
          # paths to resolve declarations.
          sudo apt-get install -y cmake ninja-build
          cd slave && cmake --preset=dev > /dev/null 2>&1 || true
          cd ..

      - name: cppcheck MISRA on slave/src
        run: |
          # Mandatory + required MISRA rules are gate-blocking. Advisory
          # (style) violations are logged but do not fail the build at
          # Phase-0; PR-10 verification tightens to include style.
          #
          # Exit-code policy:
          #   0 -> no violations
          #   1 -> mandatory/required violations OR no source files (we
          #        distinguish via grep below)
          set +e
          cppcheck \
            --addon=misra \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --error-exitcode=1 \
            --std=c11 \
            -I slave/include \
            -I slave/build/dev/export \
            slave/src \
            2>&1 | tee cppcheck-misra.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "OK: cppcheck-misra clean."
            exit 0
          fi
          if grep -q "no C or C++ source files found" cppcheck-misra.log; then
            echo "OK: no slave/src/ C files yet (Phase-0)."
            exit 0
          fi
          # Phase-0: only mandatory + required violations fail the build.
          # Advisory violations (style) are logged for triage.
          if grep -E "(mandatory|required)" cppcheck-misra.log; then
            echo "ERROR: cppcheck-misra found mandatory/required violations."
            exit 1
          fi
          echo "Note: cppcheck reported style/advisory issues; not gate-blocking at Phase-0."
          exit 0

      - name: Verify zero MISRA mandatory/required deviations
        run: |
          if grep -E "misra-c2012-(M|R)" cppcheck-misra.log; then
            echo "ERROR: open MISRA mandatory or required deviation found."
            echo "Document the deviation in docs/misra-deviations.md per ADR-0003."
            exit 1
          fi
          echo "OK: zero MISRA mandatory/required deviations."

      - name: Upload cppcheck log
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cppcheck-misra-log
          path: cppcheck-misra.log
          retention-days: 30
