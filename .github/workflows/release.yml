name: release

# Release per parent plan section 6.7 + section 11.
# Triggered on tag v*; builds PyInstaller bundles (per OS), slave tarballs, Docker image scaffold;
# attaches everything to the GitHub Release.
#
# Status: scaffolded. Real bundle content depends on Phase-1+ CLI; PR-11 finalises.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller:
    name: master / pyinstaller / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv sync --no-progress
      - name: PyInstaller (placeholder)
        run: |
          uv add --dev pyinstaller || true
          uv run pyinstaller --onefile --name tethys-master src/tethys_master/__init__.py || echo "pyinstaller: scaffolded (Phase-1 CLI entry-point lands first)"
      - name: Upload bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tethys-master-${{ matrix.os }}
          path: master/dist/*
          if-no-files-found: ignore
          retention-days: 90

  slave-tarball:
    name: slave / source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tarball slave
        run: |
          mkdir -p dist
          tar -czf dist/tethys-slave-${{ github.ref_name }}.tar.gz \
            --exclude='.git*' --exclude='build' --exclude='.gitkeep' \
            slave/
          tar -czf dist/tethys-slave-arm-none-eabi-${{ github.ref_name }}.tar.gz \
            --exclude='.git*' --exclude='build' --exclude='.gitkeep' \
            slave/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slave-tarballs
          path: dist/*
          retention-days: 90

  docker:
    name: simulator / docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Docker build (scaffold)
        run: |
          if [ -f infrastructure/docker/Dockerfile ]; then
            docker build -t tethys-sim:${{ github.ref_name }} -f infrastructure/docker/Dockerfile .
          else
            echo "Dockerfile not yet present (PR-11 adds it); skipping."
          fi

  release:
    name: github release
    needs: [pyinstaller, slave-tarball, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/*
