name: docs-site

# Public Sphinx + GitHub Pages docs site per parent plan section 11.
# Lives at https://goldr0g3r.github.io/tethys/ once the first push to main
# completes. The site renders every markdown file under `docs/` (ADRs,
# runbooks, research notes, USER_GUIDE, learn, architecture, traceability).
#
# Triggers:
#   - push to main : full build + deploy (publishes to Pages).
#   - pull_request : build only (deploy skipped) so PR previews catch
#                    broken links / orphans / Sphinx warnings.
#   - workflow_dispatch : manual rebuild trigger from Actions UI.
#
# Pages source = workflow (enabled via `gh api repos/goldr0g3r/tethys/pages
# -X POST -F build_type=workflow`). The runbook (release-process.md) +
# research note (phase-11-release-execution.md) document the one-time
# repo-setting step.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Cancel any in-flight build for the same branch when a new push arrives.
# Pages is single-deployment-at-a-time so this also protects the deploy
# queue from piling up.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: sphinx build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'docs/site/requirements.txt'
      - name: Install Sphinx + extensions (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/site/requirements.txt
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build HTML (warnings-as-errors)
        run: |
          # `-W` promotes warnings to errors so broken cross-refs / orphaned
          # docs fail PRs early. `--keep-going` reports every issue per run.
          # The `.nojekyll` marker + the root `index.html` meta-refresh
          # live in `docs/site/_extra/` and are copied to the build output
          # by `html_extra_path` in `conf.py`.
          sphinx-build -W --keep-going -c docs/site -b html docs docs/_build/html
      - name: Upload Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/_build/html
      - name: Upload preview artefact (PR runs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: docs-html-preview
          path: docs/_build/html
          retention-days: 14

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
