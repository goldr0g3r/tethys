name: fuzz-nightly

# libFuzzer nightly fuzz per parent plan section 6.7 + ADR-0010 fault-injection catalogue.
# Targets the XCP command parser (slave/src/core/cmd_dispatcher.c when it lands in Phase-2).
# New crashes open issues automatically.
#
# Status: scaffolded. No fuzz harness or corpus today; Phase-2 onwards seeds slave/fuzz/.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install clang + libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - name: Build with libFuzzer
        run: |
          if [ -d slave/fuzz ] && [ -n "$(ls slave/fuzz/*.c 2>/dev/null)" ]; then
            cd slave
            cmake --preset=fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-fsanitize=fuzzer,address,undefined -O1"
            cmake --build --preset=fuzz
          else
            echo "No fuzz harnesses yet (slave/fuzz/ empty). PR-2 onwards seeds harnesses + corpus."
            exit 0
          fi
      - name: Run fuzz (time-budgeted)
        run: |
          if [ -d slave/build/fuzz ] && [ -n "$(ls slave/build/fuzz/fuzz_* 2>/dev/null)" ]; then
            for harness in slave/build/fuzz/fuzz_*; do
              echo "=== $harness ==="
              "$harness" slave/fuzz/corpus/ -max_total_time=600 -print_pcs=1 || true
            done
          fi
      - name: Upload crash artefacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: slave/fuzz/crashes/
          retention-days: 90
          if-no-files-found: ignore
