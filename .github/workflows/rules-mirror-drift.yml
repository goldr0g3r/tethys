name: rules-mirror-drift

# Rule-mirror drift check.
# Re-runs infrastructure/rules/sync.sh; fails if .github/instructions/ diverges from .cursor/rules/.
# Resolves PR-7 follow-up F2.

on:
  pull_request:
    paths:
      - '.cursor/rules/**'
      - '.github/instructions/**'
      - 'infrastructure/rules/**'
  push:
    branches: [main]
    paths:
      - '.cursor/rules/**'

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Run sync.sh
        run: bash infrastructure/rules/sync.sh
      - name: Verify no drift
        run: |
          if ! git diff --exit-code -- '.github/instructions/'; then
            echo "ERROR: .github/instructions/ has drifted from .cursor/rules/."
            echo "Run locally: bash infrastructure/rules/sync.sh (or .\\infrastructure\\rules\\sync.ps1 on Windows)"
            exit 1
          fi
          echo "OK: rule mirror is in sync."
