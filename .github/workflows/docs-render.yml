name: docs-render

# Render docs/architecture/dep-graph.svg from dep-graph.mmd via @mermaid-js/mermaid-cli.
# Resolves PR-3 follow-up F1 (Windows local npx puppeteer install was blocked; CI runner handles it).
#
# Behaviour:
#   - On pull_request: drift check; fail if committed .svg disagrees with regenerated.
#   - On push to main: regenerate and auto-commit if changed.

on:
  pull_request:
    paths:
      - 'docs/architecture/dep-graph.mmd'
      - 'docs/architecture/dep-graph.svg'
  push:
    branches: [main]
    paths:
      - 'docs/architecture/dep-graph.mmd'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Render dep-graph.svg
        run: |
          npx -y @mermaid-js/mermaid-cli@latest mmdc \
            -i docs/architecture/dep-graph.mmd \
            -o docs/architecture/dep-graph.svg \
            --puppeteerConfigFile /dev/stdin <<'JSON'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          JSON
      - name: Commit + push if changed (push event only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/dep-graph.svg
          if git diff --cached --quiet; then
            echo "dep-graph.svg already current."
          else
            git commit -m "docs(ci): regenerate dep-graph.svg [skip ci]"
            git push
          fi
      - name: Drift check (PR event only)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --exit-code docs/architecture/dep-graph.svg; then
            echo "ERROR: docs/architecture/dep-graph.svg is stale relative to dep-graph.mmd."
            echo "Run: npx -y @mermaid-js/mermaid-cli mmdc -i docs/architecture/dep-graph.mmd -o docs/architecture/dep-graph.svg"
            exit 1
          fi
