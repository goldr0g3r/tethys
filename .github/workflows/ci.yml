name: ci

# Build + unit + integration matrix per parent plan section 6.7.
# Matrix:
#   - master (Python): ubuntu/windows/macos via uv
#   - simulator (Python): ubuntu via uv
#   - slave-posix (C): ubuntu via cmake + ninja + gcc
#   - slave-stm32 (C): ubuntu via arm-none-eabi-gcc cross-compile (placeholder; real toolchain file lands in Phase-7)
#
# Status: scaffolded. Most matrix entries pass trivially because Phase-1+ code has not landed yet.
# Phase-1 (master pinning + slave foundation) engages real builds.
#
# Single umbrella job `build` (at bottom) aggregates the matrix legs so branch
# protection can require one canonical context per parent §6.7.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  master:
    name: master / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: uv sync
        run: uv sync --no-progress
      - name: ruff
        shell: bash
        run: |
          uv run --with ruff ruff check . \
            || echo "ruff scaffolded - no rules configured yet (Phase-1)"
        continue-on-error: true
      - name: mypy
        shell: bash
        run: |
          uv run --with mypy mypy . \
            || echo "mypy scaffolded - no rules configured yet (Phase-1)"
        continue-on-error: true
      - name: pytest
        shell: bash
        run: |
          uv run --with pytest pytest --tb=short \
            || echo "pytest scaffolded - no tests yet (Phase-1)"

  simulator:
    name: simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv sync --no-progress
      - run: |
          uv run --with ruff ruff check . || true
      - run: |
          uv run --with pytest pytest --tb=short \
            || echo "pytest scaffolded - no tests yet"

  slave-posix:
    name: slave / posix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build cppcheck
      - name: CMake configure (dev preset)
        run: cd slave && cmake --preset=dev
      - name: CMake build
        run: cd slave && cmake --build --preset=dev
      - name: CTest
        run: 'cd slave && ctest --preset=dev --output-on-failure || echo "ctest scaffolded - Ceedling tests under slave/tests/ run via Ruby (PR-1a)"'

  slave-stm32:
    name: slave / stm32 (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - name: Verify cross toolchain
        run: arm-none-eabi-gcc --version
      - name: Cross-compile placeholder
        run: |
          echo "STM32 cross-compile placeholder."
          echo "Phase-7 (marine STM32F4/F7) lands the real cmake toolchain file"
          echo "at slave/cmake/arm-none-eabi.cmake and per-MCU presets."
          echo "Until then this job verifies the toolchain installs cleanly."

  # Single umbrella job whose ID maps to the parent §6.7 protection context "build".
  # Required-status-check on `build` waits for all four matrix legs above to finish.
  build:
    name: build (summary)
    runs-on: ubuntu-latest
    needs: [master, simulator, slave-posix, slave-stm32]
    if: always()
    steps:
      - name: Aggregate matrix result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more matrix legs failed"
            exit 1
          fi
          echo "All ci.yml matrix legs passed."
