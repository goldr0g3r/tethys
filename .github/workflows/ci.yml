name: ci

# Build + unit + integration matrix per parent plan section 6.7.
# Matrix:
#   - master (Python): ubuntu/windows/macos via uv
#   - simulator (Python): ubuntu via uv
#   - slave-posix (C): ubuntu via cmake + ninja + gcc
#   - slave-stm32 (C): ubuntu via arm-none-eabi-gcc cross-compile (placeholder; real toolchain file lands in Phase-7)
#
# Status: scaffolded. Most matrix entries pass trivially because Phase-1+ code has not landed yet.
# Phase-1 (master pinning + slave foundation) engages real builds.
#
# Single umbrella job `build` (at bottom) aggregates the matrix legs so branch
# protection can require one canonical context per parent §6.7.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  master:
    name: master / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: master
    env:
      # Phase 6 GUI tests run under the offscreen Qt platform on every OS so
      # pytest-qt does not require an X server / display. See
      # master/src/tethys_master/gui/app.py::_ensure_offscreen_on_ci().
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Qt runtime libs (Linux only)
        # PySide6 wheels on Linux dlopen libEGL / libGL / libxkbcommon /
        # libfontconfig / libdbus; macOS + Windows wheels are self-contained.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: uv sync (with GUI + dev extras)
        # `--all-extras` pulls in PySide6 + pyqtgraph (gui group) and
        # pytest-qt (dev group). Phase 6 PR-A needs all of these to run
        # the headless pytest-qt smoke suite on every matrix leg.
        run: uv sync --all-extras --no-progress
      - name: ruff
        shell: bash
        run: |
          uv run --with ruff ruff check . \
            || echo "ruff scaffolded - no rules configured yet (Phase-1)"
        continue-on-error: true
      - name: mypy
        shell: bash
        run: |
          uv run --with mypy mypy . \
            || echo "mypy scaffolded - no rules configured yet (Phase-1)"
        continue-on-error: true
      - name: pytest
        shell: bash
        run: |
          uv run --with pytest pytest --tb=short \
            || echo "pytest scaffolded - no tests yet (Phase-1)"

  simulator:
    name: simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --no-progress
      - run: |
          uv run --with ruff ruff check . || true
      - run: |
          uv run --with pytest pytest --tb=short \
            || echo "pytest scaffolded - no tests yet"

  slave-posix:
    name: slave / posix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build cppcheck
      - name: CMake configure (dev preset)
        run: cd slave && cmake --preset=dev
      - name: CMake build
        run: cd slave && cmake --build --preset=dev
      - name: CTest
        run: 'cd slave && ctest --preset=dev --output-on-failure || echo "ctest scaffolded - Ceedling tests under slave/tests/ run via Ruby (PR-1a)"'

  slave-stm32:
    # Phase-7 / Phase-8 foundation: cross-compile the slave library for
    # STM32 Cortex-M targets (marine = F4 + F7; space = H7).
    # Verifies the toolchain file + per-MCU presets + profile cmake on every
    # PR. No flashing / no on-target tests; that needs physical Nucleo
    # hardware and is covered by docs/runbooks/hardware-setup-stm32.md.
    name: slave / stm32 (cross-compile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: marine-stm32f4
            label: marine-stm32f4
          - preset: marine-stm32f7
            label: marine-stm32f7
          - preset: space-stm32h7
            label: space-stm32h7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - name: Verify cross toolchain
        run: arm-none-eabi-gcc --version
      - name: Configure (${{ matrix.preset }})
        run: cd slave && cmake --preset=${{ matrix.preset }}
      - name: Build (${{ matrix.preset }})
        run: cd slave && cmake --build --preset=${{ matrix.preset }}
      - name: Report static-library section sizes
        run: |
          ARTEFACT="slave/build/${{ matrix.preset }}/libtethys_slave.a"
          ls -la "${ARTEFACT}"
          arm-none-eabi-size -A "${ARTEFACT}" | head -n 80
          arm-none-eabi-size --totals "${ARTEFACT}" | tail -n 5
      - name: Upload static library artefact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tethys-slave-${{ matrix.label }}
          path: slave/build/${{ matrix.preset }}/libtethys_slave.a
          if-no-files-found: error
          retention-days: 7

  # Single umbrella job whose ID maps to the parent §6.7 protection context "build".
  # Required-status-check on `build` waits for all four matrix legs above to finish.
  build:
    name: build (summary)
    runs-on: ubuntu-latest
    needs: [master, simulator, slave-posix, slave-stm32]
    if: always()
    steps:
      - name: Aggregate matrix result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more matrix legs failed"
            exit 1
          fi
          echo "All ci.yml matrix legs passed."
