name: coverage

# Coverage per parent plan section 6.7 + ADR-0010 traceability anchors.
# C: gcovr; thresholds engage from PR-2 onward (>=95% statement, >=90% MC/DC on slave/src/core/).
# Python: coverage.py; thresholds engage from Phase-1 onward.
#
# Status: scaffolded. Today the workflow runs and prints summary; no thresholds are enforced
# because no test code exists yet. Phase-1+ engages the thresholds.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC nightly

permissions:
  contents: read

jobs:
  slave-coverage:
    name: coverage / slave (gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gcovr + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr cmake ninja-build gcc
      - name: Build with coverage flags
        run: |
          cd slave
          cmake --preset=dev -DCMAKE_C_FLAGS="--coverage -O0 -g"
          cmake --build --preset=dev || true
      - name: Run tests
        run: 'cd slave && ctest --preset=dev || echo "ctest scaffolded - no tests yet"'
      - name: gcovr report
        run: |
          cd slave
          gcovr --root . --print-summary --filter 'src/core/' --xml-pretty -o coverage.xml \
            || echo "gcovr scaffolded - nothing to cover yet"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slave-coverage
          path: slave/coverage.xml
          retention-days: 30
          if-no-files-found: ignore

  master-coverage:
    name: master / coverage.py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv sync --no-progress
      - run: |
          uv run --with coverage --with pytest coverage run -m pytest \
            || echo "coverage.py scaffolded - no tests yet"
      - run: |
          uv run --with coverage coverage report --show-missing \
            || echo "coverage.py scaffolded - no data yet"
      - run: uv run --with coverage coverage xml || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: master-coverage
          path: master/coverage.xml
          retention-days: 30
          if-no-files-found: ignore

  # Single umbrella job whose ID maps to the parent §6.7 protection context "coverage".
  coverage:
    name: coverage (summary)
    runs-on: ubuntu-latest
    needs: [slave-coverage, master-coverage]
    if: always()
    steps:
      - name: Aggregate coverage result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Coverage job failed"
            exit 1
          fi
          echo "slave + master coverage runs completed."
