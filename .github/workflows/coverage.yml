name: coverage

# Coverage per parent plan section 6.7 + ADR-0010 traceability anchors.
# C: gcovr; thresholds engage from PR-2 onward (>=95% statement, >=90% MC/DC on slave/src/core/).
# Python: coverage.py; thresholds engage from Phase-1 onward.
#
# Status: scaffolded. Today the workflow runs and prints summary; no thresholds are enforced
# because no test code exists yet. Phase-1+ engages the thresholds.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC nightly

permissions:
  contents: read

jobs:
  slave-coverage:
    name: slave / gcovr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gcovr + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr cmake ninja-build gcc
      - name: Build with coverage flags
        run: |
          cd slave
          cmake --preset=dev -DCMAKE_C_FLAGS="--coverage -O0 -g"
          cmake --build --preset=dev || true
      - name: Run tests
        run: cd slave && ctest --preset=dev || echo "ctest: no tests yet"
      - name: gcovr report
        run: |
          cd slave
          gcovr --root . --print-summary --filter 'src/core/' --xml-pretty -o coverage.xml || echo "gcovr: nothing to cover yet"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: slave-coverage
          path: slave/coverage.xml
          retention-days: 30
          if-no-files-found: ignore

  master-coverage:
    name: master / coverage.py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv sync --no-progress
      - run: uv run coverage run -m pytest || echo "coverage.py: no tests yet"
      - run: uv run coverage report --show-missing || echo "coverage.py: no data yet"
      - run: uv run coverage xml || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: master-coverage
          path: master/coverage.xml
          retention-days: 30
          if-no-files-found: ignore
