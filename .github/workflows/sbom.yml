name: sbom

# CycloneDX SBOM per parent plan section 6.7 + ADR-0008.
# Triggered on tag v*; generates Python + native SBOMs and attaches to GitHub Release.
#
# Status: scaffolded. No tag exists yet; first SBOM lands at v0.1.0.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv sync --no-progress
      - name: Generate Python SBOM (CycloneDX)
        uses: CycloneDX/gh-python-generate-sbom@39fe80937489538e12de5a7b427e078649ec44bb # v2.0.0
        with:
          input: master/pyproject.toml
          output: master-sbom.cyclonedx.json
          format: json
      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: master-sbom
          path: master-sbom.cyclonedx.json
          retention-days: 90
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF#refs/tags/}" master-sbom.cyclonedx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slave-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cyclonedx-cli + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl
          curl -L -o cyclonedx https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.2/cyclonedx-linux-x64
          chmod +x cyclonedx
          sudo mv cyclonedx /usr/local/bin/
      - name: Build slave (release)
        run: cd slave && cmake --preset=release && cmake --build --preset=release || echo "release preset not yet defined; PR-5 adds it"
      - name: Generate slave SBOM
        run: |
          # Minimal SBOM scaffold; PR-11 adds full FetchContent dependency enumeration
          cat > slave-sbom.cyclonedx.json <<'JSON'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "metadata": {
              "component": {
                "type": "library",
                "name": "tethys-slave",
                "description": "Tethys embedded XCP slave - portable C11 library; full SBOM generated by PR-11."
              }
            },
            "components": []
          }
          JSON
      - name: Upload slave SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slave-sbom
          path: slave-sbom.cyclonedx.json
          retention-days: 90
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF#refs/tags/}" slave-sbom.cyclonedx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
