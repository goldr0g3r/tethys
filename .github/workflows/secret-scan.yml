name: secret-scan

# Secret scan per parent plan section 6.7.
# TruffleHog --only-verified to avoid false positives on test-fixture-looking strings.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@af3e68261fa87568031f65161577cc2ebe1ca669 # v3.83.7
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # TruffleHog 3.x adds --fail by default; only pass extra detector flags.
          extra_args: --only-verified
